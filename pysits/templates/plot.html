<style>
.pysits-plot-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: flex-start;
    justify-content: flex-start;
}

.pysits-plot-gallery img {
    max-width: 100%;
    height: auto;
    flex: 0 1 auto;
}
</style>

<div class="pysits-plot-gallery">
    {% for figure in figures %}
    <img src="{{ figure.source }}"
         alt="{{ figure.alt }}"
         width="{{ figure.width }}"
         height="{{ figure.height }}" />
    {% endfor %}
</div>
